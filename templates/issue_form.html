{% extends "base.html" %}{% block content %}<section class="formpage"><a href="{{ url_for('issues') }}">← Back</a><h1>Report infrastructure damage</h1><p class="muted">Use fictional locations only.</p><form method="post" enctype="multipart/form-data" class="panel stack"><label>Title<input name="title" maxlength="150" required></label><label>Description<textarea name="description" rows="4" required></textarea></label><div class="twocol"><label>Asset type<select name="asset_type">{% for s in ['Road','Bridge','Pothole','Streetlight','Water Supply','Public Facility','Slope','Tunnel','Other'] %}<option>{{ s }}</option>{% endfor %}</select></label><label>Severity<select name="severity">{% for s in ['Low','Medium','High','Critical'] %}<option>{{ s }}</option>{% endfor %}</select></label></div><label>Urgency<select name="urgency">{% for s in ['Routine','Soon','Urgent','Immediate'] %}<option {{ 'selected' if s=='Soon' else '' }}>{{ s }}</option>{% endfor %}</select></label><label>Simulated location<input name="simulated_location" placeholder="Demo Sector A / Road R-01" required></label><label>Optional photo (JPG/PNG/WEBP, max 5 MB)<input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"></label><button class="btn">Submit report</button></form></section>{% endblock %}
