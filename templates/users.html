{% extends "base.html" %}{% block content %}<h1>User and role management</h1><form method="post" class="panel stack gap"><h2>Create user</h2><div class="twocol"><label>Name<input name="name" required></label><label>Email<input type="email" name="email" required></label><label>Password (10+ characters)<input type="password" name="password" minlength="10" required></label><label>Role<select name="role">{% for r in ['admin','engineer','maintenance','viewer'] %}<option>{{ r }}</option>{% endfor %}</select></label></div><button class="btn">Create user</button></form><section class="panel tablewrap"><table><tr><th>Name</th><th>Email</th><th>Role</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>{% endfor %}</table></section>{% endblock %}
