{% extends "base.html" %}{% block content %}<h1>Audit log</h1><section class="panel tablewrap"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>{% for x in logs %}<tr><td>{{ x.created_at }}</td><td>{{ x.email or 'Unknown' }}</td><td>{{ x.action }}</td><td>{{ x.details }}</td></tr>{% else %}<tr><td colspan="4">No logs.</td></tr>{% endfor %}</table></section>{% endblock %}
