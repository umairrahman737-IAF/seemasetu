<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="armyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="armyNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="armyRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <filter id="armyGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Outer Crest Shield -->
  <circle cx="120" cy="120" r="110" fill="url(#armyNavy)" stroke="url(#armyGold)" stroke-width="4" filter="url(#armyGlow)"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="url(#armyGold)" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Crossed Indian Army Swords in Background -->
  <g stroke="url(#armyGold)" stroke-width="3" stroke-linecap="round">
    <!-- Sword 1: Top-Left to Bottom-Right -->
    <line x1="45" y1="45" x2="195" y2="195" />
    <line x1="185" y1="185" x2="175" y2="195" stroke-width="6" />
    <circle cx="196" cy="196" r="4" fill="url(#armyGold)" />
    <!-- Sword 2: Top-Right to Bottom-Left -->
    <line x1="195" y1="45" x2="45" y2="195" />
    <line x1="55" y1="185" x2="65" y2="195" stroke-width="6" />
    <circle cx="44" cy="196" r="4" fill="url(#armyGold)" />
  </g>

  <!-- Central Shield / Castle Emblem (Corps of Engineers) -->
  <g filter="url(#armyGlow)">
    <path d="M70 70 L170 70 L170 120 C170 155 120 185 120 185 C120 185 70 155 70 120 Z" 
          fill="url(#armyRed)" stroke="url(#armyGold)" stroke-width="3"/>
    <!-- Castle Fortification Silhouette -->
    <path d="M88 126 h64 v-36 h-10 v8 h-10 v-8 h-8 v8 h-8 v-8 h-10 v8 h-10 v-8 h-8 z" fill="url(#armyGold)"/>
    <path d="M112 126 h16 v-16 a8 8 0 0 0 -16 0 z" fill="#0F172A"/>
  </g>

  <!-- Ashoka Lions / State Capital Stylized Motif -->
  <g fill="url(#armyGold)" filter="url(#armyGlow)">
    <!-- Pedestal / Abacus -->
    <rect x="94" y="38" width="52" height="6" rx="2" />
    <circle cx="120" cy="41" r="2.5" fill="#1E293B"/>
    <!-- Three Lion Heads Stylized -->
    <path d="M110 18 C108 12 132 12 130 18 C135 22 135 34 130 38 L110 38 C105 34 105 22 110 18 Z" />
    <circle cx="102" cy="28" r="7" />
    <circle cx="138" cy="28" r="7" />
    <circle cx="120" cy="22" r="8" />
  </g>

  <!-- Golden Scroll Banner -->
  <g filter="url(#armyGlow)">
    <path d="M40 188 L60 180 L180 180 L200 188 L185 206 L55 206 Z" fill="#991B1B" stroke="url(#armyGold)" stroke-width="2"/>
    <text x="120" y="198" font-family="'Nirmala UI', 'Mangal', sans-serif" font-size="12" font-weight="900" fill="#FEF08A" text-anchor="middle" letter-spacing="1">सर्वत्र</text>
  </g>
  <text x="120" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#FCD34D" text-anchor="middle" letter-spacing="1.2">CORPS OF ENGINEERS &#8226; INDIAN ARMY</text>
</svg>
