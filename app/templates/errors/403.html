{% extends "base.html" %}

{% block title %}Access Denied (403) — SeemaSetu{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🚫</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">403 &mdash; Access Forbidden</h1>

    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Operations Portal</a>
  </div>
</div>
{% endblock %}
