{% extends "base.html" %}

{% block title %}Record Not Found (404) — SeemaSetu{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <div style="font-size: 3rem; margin-bottom: 0.5rem;">🗺️</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">404 &mdash; Page or Ticket Not Found</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0.75rem 0 1.5rem 0;">
      The requested issue ticket, work order, or navigational route does not exist in the border database.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Operations Portal</a>
  </div>
</div>
{% endblock %}
